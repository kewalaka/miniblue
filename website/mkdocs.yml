site_name: miniblue
site_url: https://miniblue.io
site_description: Local Azure development. One binary. No account needed.
site_author: Mo Abukar
repo_url: https://github.com/moabukar/miniblue
repo_name: moabukar/miniblue
edit_uri: edit/main/website/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Configuration: getting-started/configuration.md
  - Guides:
    - Terraform: guides/terraform.md
    - Terraform acceptance tests: guides/acceptance-tests.md
    - Pulumi: guides/pulumi.md
    - SDKs (Python, Go, JS): guides/sdk.md
    - azlocal CLI: guides/azlocal.md
    - CLI Reference: guides/azure-cli.md
    - Docker: guides/docker.md
    - Helm / Kubernetes: guides/helm.md
  - Services:
    - Overview: services/overview.md
    - API Parity Matrix: services/parity.md
    - Resource Groups: services/resource-groups.md
    - Storage Accounts: services/storage-accounts.md
    - Blob Storage: services/blob-storage.md
    - Table Storage: services/table-storage.md
    - Queue Storage: services/queue-storage.md
    - Key Vault: services/key-vault.md
    - Cosmos DB: services/cosmos-db.md
    - Service Bus: services/service-bus.md
    - Event Grid: services/event-grid.md
    - App Configuration: services/app-configuration.md
    - Azure Functions: services/functions.md
    - Virtual Networks: services/virtual-networks.md
    - Public IP Addresses: services/public-ip-addresses.md
    - Network Security Groups: services/network-security-groups.md
    - Network Interfaces: services/network-interfaces.md
    - Load Balancer: services/load-balancer.md
    - Application Gateway: services/application-gateway.md
    - DNS Zones: services/dns-zones.md
    - Container Registry: services/container-registry.md
    - Container Instances: services/container-instances.md
    - Kubernetes Service (AKS): services/kubernetes-service.md
    - Virtual Machines: services/virtual-machines.md
    - Managed Disks: services/managed-disks.md
    - Managed Identity: services/managed-identity.md
    - RBAC: services/rbac.md
    - DB for PostgreSQL: services/database-postgresql.md
    - DB for MySQL: services/database-mysql.md
    - Azure SQL Database: services/database-sql.md
    - Azure Cache for Redis: services/redis.md
  - Architecture:
    - Overview: architecture/overview.md
    - Scope and Philosophy: architecture/scope.md
    - ARM Resource Engine: architecture/arm-engine.md
    - ARM foundations:
      - Overview: architecture/arm-foundations/index.md
      - Plan: architecture/arm-foundations/PLAN.md
      - "ADR-0001: Single ARM pipeline": architecture/arm-foundations/adr/0001-single-arm-pipeline.md
      - "ADR-0002: Unregistered types": architecture/arm-foundations/adr/0002-unregistered-types.md
      - "ADR-0003: Pipeline phases and hooks": architecture/arm-foundations/adr/0003-pipeline-phases-and-hooks.md
      - "ADR-0004: Storage contract": architecture/arm-foundations/adr/0004-storage-contract.md
      - "ADR-0005: Type metadata and conformance": architecture/arm-foundations/adr/0005-type-metadata-and-conformance.md
      - "ADR-0006: Sync LRO and errors": architecture/arm-foundations/adr/0006-sync-lro-and-errors.md
      - "ADR-0007: Migration strategy": architecture/arm-foundations/adr/0007-migration-strategy.md
      - "ADR-0008: RBAC and policy minimum": architecture/arm-foundations/adr/0008-rbac-and-policy-minimum.md
      - "Slice: role assignments": architecture/arm-foundations/slices/01-role-assignments.md
      - "Slice: APIM Consumption": architecture/arm-foundations/slices/02-apim-consumption.md
      - Spike: architecture/arm-foundations/SPIKE.md
      - Scenario catalogue:
          - Overview: architecture/arm-foundations/catalogue/index.md
          - Engine lessons: architecture/arm-foundations/catalogue/engine-lessons.md
          - Cross-cutting: architecture/arm-foundations/catalogue/cross-cutting.md
          - Client suites: architecture/arm-foundations/catalogue/client-suites.md
          - API Management: architecture/arm-foundations/catalogue/api-management.md
          - API Management provider notes: architecture/arm-foundations/catalogue/api-management-provider-notes.md
          - App Configuration: architecture/arm-foundations/catalogue/app-configuration.md
          - App Service: architecture/arm-foundations/catalogue/app-service.md
          - Authorization: architecture/arm-foundations/catalogue/authorization.md
          - Compute: architecture/arm-foundations/catalogue/compute.md
          - Container Instances: architecture/arm-foundations/catalogue/container-instances.md
          - Container Registry: architecture/arm-foundations/catalogue/container-registry.md
          - Cosmos DB: architecture/arm-foundations/catalogue/cosmos-db.md
          - Deployments: architecture/arm-foundations/catalogue/deployments.md
          - Disk: architecture/arm-foundations/catalogue/disk.md
          - Event Grid: architecture/arm-foundations/catalogue/event-grid.md
          - Event Hubs: architecture/arm-foundations/catalogue/event-hubs.md
          - Insights: architecture/arm-foundations/catalogue/insights.md
          - Key Vault: architecture/arm-foundations/catalogue/key-vault.md
          - Load Balancer: architecture/arm-foundations/catalogue/load-balancer.md
          - Log Analytics: architecture/arm-foundations/catalogue/log-analytics.md
          - Managed identity: architecture/arm-foundations/catalogue/managed-identity.md
          - Management groups: architecture/arm-foundations/catalogue/management-groups.md
          - Redis: architecture/arm-foundations/catalogue/redis.md
          - Resource groups: architecture/arm-foundations/catalogue/resource-groups.md
          - Service Bus: architecture/arm-foundations/catalogue/service-bus.md
          - SQL: architecture/arm-foundations/catalogue/sql.md
          - Storage: architecture/arm-foundations/catalogue/storage.md
          - Subscriptions and providers: architecture/arm-foundations/catalogue/subscriptions-providers.md
          - Virtual network: architecture/arm-foundations/catalogue/virtual-network.md
  - Contributing: contributing.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/moabukar/miniblue
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/moabukar/miniblue
